class: Products
table: products

fields:
  userId: int
  title: String
  description: String
  price: double
  brandId: int
  clubType: String
  flexType: String
  year: int
  region1: String
  region2: String
  region3: String?
  region4: String?
  salesStatus: String
  lat: double?
  lng: double?
  isDeleted: bool
  createdAt: DateTime
  updatedAt: DateTime
  images: List<ProductsImages>?, relation
  likes: List<ProductsLikes>?, relation
  reports: List<ProductsReports>?, relation
  chatRooms: List<ChatRooms>?, relation
